<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kalkulator Ilmiah</title>
  <!-- Menghubungkan file tampilan -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="kalkulator">
    <!-- Layar: baris atas = hitungan sebelumnya, baris bawah = angka saat ini -->
    <div class="layar">
      <div class="riwayat" id="riwayat"></div>
      <div class="angka" id="angka">0</div>
    </div>

    <!-- Tombol untuk membuka/menutup panel ilmiah -->
    <button class="saklar" id="tombolIlmiah" data-aksi="saklar"
            aria-expanded="false" aria-controls="panelIlmiah">Ilmiah</button>

    <!-- Panel ilmiah (tersembunyi dulu, muncul saat tombol "Ilmiah" ditekan) -->
    <div class="ilmiah" id="panelIlmiah" hidden>
      <button data-aksi="fungsi" data-nilai="sin">sin</button>
      <button data-aksi="fungsi" data-nilai="cos">cos</button>
      <button data-aksi="fungsi" data-nilai="tan">tan</button>
      <button data-aksi="fungsi" data-nilai="log">log</button>
      <button data-aksi="fungsi" data-nilai="ln">ln</button>

      <button data-aksi="fungsi" data-nilai="akar">√</button>
      <button data-aksi="fungsi" data-nilai="kuadrat">x²</button>
      <button data-aksi="operator" data-nilai="^">x<sup>y</sup></button>
      <button data-aksi="fungsi" data-nilai="kebalikan">1/x</button>
      <button data-aksi="fungsi" data-nilai="faktorial">n!</button>

      <button data-aksi="konstanta" data-nilai="pi">π</button>
      <button data-aksi="konstanta" data-nilai="e">e</button>
      <button data-aksi="tanda">±</button>
      <button class="sudut lebar2" id="tombolSudut" data-aksi="sudut">DEG</button>
    </div>

    <!-- Tombol-tombol utama. data-aksi dipakai JavaScript untuk tahu tombol apa yang ditekan -->
    <div class="tombol">
      <button class="fungsi" data-aksi="hapus-semua">AC</button>
      <button class="fungsi" data-aksi="hapus">⌫</button>
      <button class="fungsi" data-aksi="persen">%</button>
      <button class="operator" data-aksi="operator" data-nilai="÷">÷</button>

      <button data-aksi="angka" data-nilai="7">7</button>
      <button data-aksi="angka" data-nilai="8">8</button>
      <button data-aksi="angka" data-nilai="9">9</button>
      <button class="operator" data-aksi="operator" data-nilai="×">×</button>

      <button data-aksi="angka" data-nilai="4">4</button>
      <button data-aksi="angka" data-nilai="5">5</button>
      <button data-aksi="angka" data-nilai="6">6</button>
      <button class="operator" data-aksi="operator" data-nilai="−">−</button>

      <button data-aksi="angka" data-nilai="1">1</button>
      <button data-aksi="angka" data-nilai="2">2</button>
      <button data-aksi="angka" data-nilai="3">3</button>
      <button class="operator" data-aksi="operator" data-nilai="+">+</button>

      <button class="lebar" data-aksi="angka" data-nilai="0">0</button>
      <button data-aksi="desimal">,</button>
      <button class="sama" data-aksi="hasil">=</button>
    </div>
  </main>

  <!-- Menghubungkan file JavaScript. Harus di bawah, setelah semua tombol dibuat -->
  <script src="script.js"></script>
</body>
</html>
